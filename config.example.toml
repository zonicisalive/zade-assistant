# Copy to ~/.config/zade/config.toml and change only what you need.
# Anything left out uses the built-in default (zade/config.py).

[wake]
model = "hey_jarvis"        # after Task 10: "~/.local/share/zade/zade.onnx"
threshold = 0.5

[audio]
rms_threshold = 500         # raise if background noise keeps recordings open

[llm]
provider = "ollama"         # ollama | anthropic | openai
model = "qwen3:4b-instruct"   # non-thinking; plain qwen3:4b is thinking-only and slow
keep_alive = "60s"          # "0" unloads right after each answer
fallback = "cpu"            # cpu | none | anthropic | openai

[stt]
provider = "whisper"        # whisper | openai

[tts]
provider = "piper"          # piper | openai

[providers.anthropic]
model = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "low"              # set to "" for models without effort support (e.g. claude-haiku-4-5)
fallbacks = "default"       # set to "" for models without server-side fallbacks

# Any OpenAI-compatible vendor. Gemini example:
#   base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
#   model = "gemini-2.5-flash"
#   api_key_env = "GEMINI_API_KEY"
[providers.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
