# Copy to ~/.config/zade/config.toml and change only what you need.
# Anything left out uses the built-in default (zade/config.py).

[wake]
model = "hey_jarvis"        # after Task 10: "~/.local/share/zade/zade.onnx"
threshold = 0.5

[audio]
rms_threshold = 500         # minimum speech loudness; the real threshold adapts to room noise
noise_factor = 2.5          # speech must be this many times louder than the room; lower if it cuts you off

[llm]
provider = "ollama"         # ollama | anthropic | openai
model = "qwen2.5:7b-instruct" # any Ollama model with tool calling; this one needs ~4.7 GB VRAM
keep_alive = "30s"          # "0" unloads right after each answer
fallback = "cpu"            # cpu | none | anthropic | openai

[stt]
provider = "whisper"        # whisper | openai
# hotwords = ["Zade", "workspace", ...]   # words to expect; your shortcut names are added automatically

[tts]
provider = "kokoro"         # kokoro | piper | openai
voice = "af_heart"          # Kokoro voice; b* voices (bf_emma, bm_george) are British
speed = 1.2

[providers.anthropic]
model = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "low"              # set to "" for models without effort support (e.g. claude-haiku-4-5)
fallbacks = "default"       # set to "" for models without server-side fallbacks

# Any OpenAI-compatible vendor. Gemini example:
#   base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
#   model = "gemini-2.5-flash"
#   api_key_env = "GEMINI_API_KEY"
[providers.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"

[router]
# Laya spike 2026-09-23 on this PC (CPU): 18/24 correct, p50 448 ms, wrong picks up to 0.79 confidence.
# Below the 90% / 150 ms gate, so it is off. Re-run scripts/spike_laya.py after a Laya update before enabling.
laya_enabled = false

[hotkey]
# Hold this key alone to make Zade listen, like saying "hey zade". Needs the 'input' group.
enabled = true
key = "KEY_LEFTMETA"        # the Win/Super key; e.g. KEY_RIGHTCTRL
hold_s = 2.0                # keep holding after the beep while you talk; release = done

[ui]
# Top-center overlay (Quickshell) showing what Zade hears and says; follows your wallpaper colors.
enabled = true

[followup]
# When Zade's reply is a question, listen this long for an answer (soft beep, no wake word).
enabled = true
listen_s = 5.0
history_turns = 3           # recent exchanges the model sees, forgotten after history_s
history_s = 120

[web]
# Local SearXNG for web answers. Needs `formats: [html, json]` under `search:` in its settings.yml.
searxng_url = "http://127.0.0.1:8080"

[dictation]
# Voice typing: hold this key, speak, release -> the words are typed into the focused window.
enabled = true
key = "KEY_RIGHTALT"
hold_s = 0.3

[vision]
# "What's on my screen?" uses this Ollama vision model (loaded only when asked).
model = "qwen2.5vl:3b"

# Overlay style: position = top | bottom | top-left | top-right | bottom-left | bottom-right
# [ui]
# size = "medium"            # small | medium | large
# accent = ""                # "" = wallpaper colour, or e.g. "#ff9f43"
# linger_s = 0.5             # seconds the reply stays after Zade stops talking
# reveal_cps = 18            # reply typing speed (characters per second)
# show_heard = true

[sound]
chime = "soft"               # soft | classic | none
volume = 0.6
wake_reply = ""              # e.g. "Yes?"

[quiet]
enabled = false              # ignore the wake word and hold reminders in this window
start = "23:00"
end = "08:00"
dnd = false                  # Do Not Disturb, any time (holding Win still works)

[safety]
confirm = "commands"         # commands | risky | everything
