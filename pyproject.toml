[project]
name = "zade"
version = "0.1.0"
description = "Local-first desktop voice assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "sounddevice",
  "openwakeword>=0.6",
  "faster-whisper>=1.1",
  "piper-tts>=1.3",
  "rapidfuzz>=3",
  "ollama>=0.5",
  "anthropic",
  "openai>=1.40",
  "laya",
  "torch",
  "kokoro-onnx>=0.6.1",
  "evdev>=2.0.0",
]

[project.scripts]
zade = "zade.__main__:main"

[dependency-groups]
dev = ["pytest"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
